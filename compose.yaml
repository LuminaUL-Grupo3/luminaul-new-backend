name: luminaul-equipo
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: luminaul_equipo
      POSTGRES_USER: luminaul
      POSTGRES_PASSWORD: luminaul_equipo_local
    ports:
      - '127.0.0.1:55434:5432'
    volumes:
      - equipo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luminaul -d luminaul_equipo']
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:11026:1025'
      - '127.0.0.1:8026:8025'
volumes:
  equipo_pgdata:
